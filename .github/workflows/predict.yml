name: Predict

on:
  schedule:
    - cron: '0 18 * * 2'  # Tuesday  18:00 UTC (midweek fixtures)
    - cron: '0 18 * * 5'  # Friday   18:00 UTC (weekend fixtures)
    - cron: '0 13 * * 6'  # Saturday 13:00 UTC (weekend fixtures)
    - cron: '0 12 * * 0'  # Sunday   12:00 UTC (weekend fixtures)
  workflow_dispatch:

permissions:
  contents: write  # needed by peaceiris/actions-gh-pages to push to gh-pages branch

concurrency:
  group: predict-shadow-ledger
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync

      - name: Restore historical match data
        uses: actions/cache/restore@v4
        id: cache-data
        with:
          path: data/raw
          key: football-data-${{ github.run_id }}
          restore-keys: football-data-

      - name: Download historical data (first run or cache miss)
        run: |
          uv run python - <<'EOF'
          import glob
          csvs = [f for f in glob.glob("data/raw/*.csv") if "fixtures" not in f]
          if len(csvs) < 50:
              from src.data.download import download_all
              download_all()
          EOF

      - name: Run predictions
        env:
          THEODDS_API: ${{ secrets.THEODDS_API }}
        run: uv run python main.py --predict --threshold 0.0

      - name: Save updated match data to cache
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: football-data-${{ github.run_id }}

      - name: Commit shadow evaluation ledger
        run: |
          ledger_paths=()
          for ledger_path in data/shadow/predictions.csv data/shadow/settlements.csv; do
            if [[ -e "$ledger_path" ]]; then
              ledger_paths+=("$ledger_path")
            fi
          done
          if (( ${#ledger_paths[@]} > 0 )); then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "${ledger_paths[@]}"
            if ! git diff --staged --quiet; then
              git commit --only -m "chore: update shadow evaluation ledger" \
                "${ledger_paths[@]}"
              git push origin "HEAD:${GITHUB_REF}"
            fi
          fi

      - name: Stage HTML for Pages
        run: |
          mkdir -p docs
          shopt -s nullglob
          files=(reports/predictions_*.html)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No prediction HTML produced by --predict (expected reports/predictions_*.html)"
            exit 1
          fi
          latest=$(ls -t "${files[@]}" | head -1)
          cp "$latest" docs/predictions.html
          if [[ ! -f reports/shadow_evaluation.html ]]; then
            echo "::error::No shadow evaluation HTML produced by --predict"
            exit 1
          fi
          cp reports/shadow_evaluation.html docs/shadow.html
          touch docs/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # preserve eval.html between predict runs
