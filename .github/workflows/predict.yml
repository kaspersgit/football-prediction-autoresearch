name: Predict

# Manual-only for now. This used to also run on a cron schedule with a
# sleep-until-next-kickoff-wave loop (sleep until T-10 before each upcoming
# kickoff, then run --predict fresh for that wave, capped at a 4h budget per
# trigger) — removed 2026-11-01 because that logic wasn't working reliably.
# Re-add a schedule: block once the manual path is solid and there's an
# appetite to debug the wave-waiting logic properly.
on:
  workflow_dispatch:

permissions:
  contents: write  # needed by peaceiris/actions-gh-pages to push to gh-pages branch

concurrency:
  group: predict-shadow-ledger
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync

      - name: Run predictions
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          THEODDS_API: ${{ secrets.THEODDS_API }}
        run: uv run python main.py --predict --threshold 0.0

      - name: Commit newly archived historical seasons
        # archive_finished_seasons() runs inside --predict itself; this only
        # produces a commit the rare time it actually backfilled a gap.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historical
          if ! git diff --staged --quiet; then
            git commit -m "chore: archive finished season(s) found during predict run"
            git push origin "HEAD:${GITHUB_REF}"
          fi

      - name: Commit shadow evaluation ledger
        run: |
          ledger_paths=()
          for ledger_path in data/shadow/predictions.csv data/shadow/settlements.csv; do
            if [[ -e "$ledger_path" ]]; then
              ledger_paths+=("$ledger_path")
            fi
          done
          if (( ${#ledger_paths[@]} > 0 )); then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "${ledger_paths[@]}"
            if ! git diff --staged --quiet; then
              git commit --only -m "chore: update shadow evaluation ledger" \
                "${ledger_paths[@]}"
              git push origin "HEAD:${GITHUB_REF}"
            fi
          fi

      - name: Stage HTML for Pages
        run: |
          mkdir -p docs
          shopt -s nullglob
          files=(reports/predictions_*.html)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No prediction HTML produced by --predict (expected reports/predictions_*.html)"
            exit 1
          fi
          latest=$(ls -t "${files[@]}" | head -1)
          cp "$latest" docs/predictions.html
          if [[ ! -f reports/shadow_evaluation.html ]]; then
            echo "::error::No shadow evaluation HTML produced by --predict"
            exit 1
          fi
          cp reports/shadow_evaluation.html docs/shadow.html
          touch docs/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # preserve eval.html between predict runs
