name: Predict

on:
  # GitHub Actions cron always runs in UTC and has no DST concept, so each
  # Amsterdam-local target time below needs two entries: one UTC offset for
  # CEST months (Apr-Oct, UTC+2) and one for CET months (Nov-Mar, UTC+1). The
  # ~1-week window around the actual DST-switch Sunday (late Mar / late Oct)
  # will run an hour off from the intended local time; not worth a runtime
  # timezone check for this pipeline's precision needs.
  #
  # GitHub's cron itself is best-effort and can fire several minutes late, so
  # these times below are just a "wake up by roughly here" floor, not the
  # actual prediction time: the "Run predictions once per upcoming kickoff
  # wave" step sleeps the runner precisely until 10 minutes before each
  # distinct kickoff time still ahead in fixtures.csv, running a fresh
  # prediction pass before every wave (capped so a run spanning many waves
  # can't blow past the job timeout — see that step for details).
  schedule:
    - cron: '0 16 * 4-10 2'        # Tuesday  18:00 Amsterdam (CEST, midweek fixtures)
    - cron: '0 17 * 11,12,1,2,3 2' # Tuesday  18:00 Amsterdam (CET,  midweek fixtures)
    - cron: '0 15 * 4-10 5'        # Friday   17:00 Amsterdam (CEST, weekend fixtures)
    - cron: '0 16 * 11,12,1,2,3 5' # Friday   17:00 Amsterdam (CET,  weekend fixtures)
    - cron: '0 11 * 4-10 6'        # Saturday 13:00 Amsterdam (CEST, early/afternoon kickoffs)
    - cron: '0 12 * 11,12,1,2,3 6' # Saturday 13:00 Amsterdam (CET,  early/afternoon kickoffs)
    # Saturday evening kickoffs (18:30-21:00) run too late for the 13:00 run's
    # 4h loop budget to reach, so they get their own wake-up closer to them.
    - cron: '30 15 * 4-10 6'        # Saturday 17:30 Amsterdam (CEST, evening kickoffs)
    - cron: '30 16 * 11,12,1,2,3 6' # Saturday 17:30 Amsterdam (CET,  evening kickoffs)
    - cron: '0 10 * 4-10 0'        # Sunday   12:00 Amsterdam (CEST, early/afternoon kickoffs)
    - cron: '0 11 * 11,12,1,2,3 0' # Sunday   12:00 Amsterdam (CET,  early/afternoon kickoffs)
    # Same reasoning as Saturday's split above: evening kickoffs run too late
    # for the 12:00 run's 4h loop budget to reach.
    - cron: '30 15 * 4-10 0'        # Sunday   17:30 Amsterdam (CEST, evening kickoffs)
    - cron: '30 16 * 11,12,1,2,3 0' # Sunday   17:30 Amsterdam (CET,  evening kickoffs)
  workflow_dispatch:

permissions:
  contents: write  # needed by peaceiris/actions-gh-pages to push to gh-pages branch

concurrency:
  group: predict-shadow-ledger
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # default GitHub-hosted job cap; stated explicitly since the
                           # sleep-until-kickoff step below can idle for hours

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync

      - name: Run predictions once per upcoming kickoff wave
        # Only for scheduled runs: manual workflow_dispatch runs once, right away
        # (see "Run predictions immediately" below).
        if: github.event_name == 'schedule'
        env:
          THEODDS_API: ${{ secrets.THEODDS_API }}
        run: |
          uv run python - <<'EOF'
          from datetime import datetime, timedelta, timezone
          import subprocess
          import sys
          import time

          from src.data.download import download_fixtures
          from src.data.kickoff import upcoming_kickoff_groups_utc

          # Bound the whole loop so a run spanning many waves (e.g. Friday's run
          # covering the whole weekend) can't run the job past its timeout. Any
          # wave whose T-10 target falls beyond this deadline is left for a
          # later scheduled run to catch instead.
          DEADLINE = datetime.now(timezone.utc) + timedelta(hours=4)

          def run_predict():
              subprocess.run(
                  [sys.executable, "main.py", "--predict", "--threshold", "0.0"],
                  check=True,
              )

          download_fixtures()
          waves = upcoming_kickoff_groups_utc()
          print(f"{len(waves)} upcoming kickoff wave(s) found")

          ran_any = False
          for i, kickoff in enumerate(waves, start=1):
              target = kickoff - timedelta(minutes=10)
              if target > DEADLINE:
                  print(f"Stopping: wave {i}/{len(waves)} ({kickoff.isoformat()}) is "
                        "beyond this run's time budget — a later scheduled run will catch it")
                  break
              seconds = max(0.0, (target - datetime.now(timezone.utc)).total_seconds())
              print(f"Wave {i}/{len(waves)}: kickoff {kickoff.isoformat()} — sleeping {seconds:.0f}s")
              time.sleep(seconds)
              print(f"Running predictions for wave {i}/{len(waves)}")
              run_predict()
              ran_any = True

          # Guarantee at least one predict pass per scheduled run (matches the
          # pre-wave-aware behavior) even when there's no wave within budget yet
          # (e.g. every upcoming kickoff is still hours off, or none is known).
          if not ran_any:
              print("No wave within this run's time budget — running once immediately")
              run_predict()
          EOF

      - name: Run predictions immediately
        if: github.event_name != 'schedule'
        env:
          THEODDS_API: ${{ secrets.THEODDS_API }}
        run: uv run python main.py --predict --threshold 0.0

      - name: TEMP diagnostic - Pinnacle coverage by month (current + previous season)
        run: |
          uv run python - <<'EOF'
          from pathlib import Path

          import pandas as pd

          from src.config import PRODUCTION_LEAGUES
          from src.data.download import SEASONS

          for season in SEASONS[-2:]:
              print(f"\n{'='*90}\nSEASON {season}\n{'='*90}")
              for league in sorted(PRODUCTION_LEAGUES):
                  path = Path("data/raw") / f"{league}_{season}.csv"
                  if not path.exists():
                      print(f"{league}: file not found ({path})")
                      continue
                  df = pd.read_csv(path, encoding="latin-1", low_memory=False)
                  if len(df) == 0:
                      print(f"{league}: no rows yet")
                      continue
                  df["Date"] = pd.to_datetime(df["Date"], dayfirst=True, errors="coerce")
                  df["month"] = df["Date"].dt.to_period("M")
                  has_open = all(c in df.columns for c in ["PSH", "PSD", "PSA"])
                  has_close = all(c in df.columns for c in ["PSCH", "PSCD", "PSCA"])
                  print(f"\n--- {league} ({len(df)} matches, {df['Date'].min().date()} to {df['Date'].max().date()}) ---")
                  print(f"  columns present: opening PSH/PSD/PSA={has_open}  closing PSCH/PSCD/PSCA={has_close}")
                  if has_open:
                      df["open_ok"] = df[["PSH","PSD","PSA"]].apply(pd.to_numeric, errors="coerce").notna().all(axis=1)
                  else:
                      df["open_ok"] = False
                  if has_close:
                      df["close_ok"] = df[["PSCH","PSCD","PSCA"]].apply(pd.to_numeric, errors="coerce").notna().all(axis=1)
                  else:
                      df["close_ok"] = False
                  by_month = df.groupby("month").agg(
                      matches=("Date", "count"),
                      opening_pct=("open_ok", "mean"),
                      closing_pct=("close_ok", "mean"),
                  )
                  by_month["opening_pct"] = (by_month["opening_pct"] * 100).round(0).astype(int)
                  by_month["closing_pct"] = (by_month["closing_pct"] * 100).round(0).astype(int)
                  print(by_month.to_string())
          EOF

      - name: Commit newly archived historical seasons
        # archive_finished_seasons() runs inside --predict itself; this only
        # produces a commit the rare time it actually backfilled a gap.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historical
          if ! git diff --staged --quiet; then
            git commit -m "chore: archive finished season(s) found during predict run"
            git push origin "HEAD:${GITHUB_REF}"
          fi

      - name: Commit shadow evaluation ledger
        run: |
          ledger_paths=()
          for ledger_path in data/shadow/predictions.csv data/shadow/settlements.csv; do
            if [[ -e "$ledger_path" ]]; then
              ledger_paths+=("$ledger_path")
            fi
          done
          if (( ${#ledger_paths[@]} > 0 )); then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "${ledger_paths[@]}"
            if ! git diff --staged --quiet; then
              git commit --only -m "chore: update shadow evaluation ledger" \
                "${ledger_paths[@]}"
              git push origin "HEAD:${GITHUB_REF}"
            fi
          fi

      - name: Stage HTML for Pages
        run: |
          mkdir -p docs
          shopt -s nullglob
          files=(reports/predictions_*.html)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No prediction HTML produced by --predict (expected reports/predictions_*.html)"
            exit 1
          fi
          latest=$(ls -t "${files[@]}" | head -1)
          cp "$latest" docs/predictions.html
          if [[ ! -f reports/shadow_evaluation.html ]]; then
            echo "::error::No shadow evaluation HTML produced by --predict"
            exit 1
          fi
          cp reports/shadow_evaluation.html docs/shadow.html
          touch docs/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # preserve eval.html between predict runs
