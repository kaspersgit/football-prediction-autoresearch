name: Evaluate

on:
  # See predict.yml for why each Amsterdam-local target needs two UTC cron
  # entries (CEST vs CET) — same DST caveat applies here.
  schedule:
    - cron: '0 2 * 4-10 1'        # Monday 04:00 Amsterdam (CEST, weekly backtest refresh)
    - cron: '0 3 * 11,12,1,2,3 1' # Monday 04:00 Amsterdam (CET,  weekly backtest refresh)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync

      - name: Run backtest
        run: uv run python main.py --per-league --threshold 0.0 --pinnacle-filter --update

      - name: Commit newly archived historical seasons
        # archive_finished_seasons() runs inside the backtest itself; this only
        # produces a commit the rare time it actually backfilled a gap.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historical
          if ! git diff --staged --quiet; then
            git commit -m "chore: archive finished season(s) found during evaluate run"
            git push
          fi

      - name: Commit updated evaluation artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/evaluation_bets.csv reports/backtest_bets.csv models/league_thresholds.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update evaluation artifacts"
            git push
          fi

      - name: Stage HTML for Pages
        run: |
          mkdir -p docs
          cp reports/evaluation_report.html docs/eval.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # preserve index.html between evaluate runs
