name: Evaluate

on:
  schedule:
    - cron: '0 4 * * 1'  # Monday 04:00 UTC (weekly backtest refresh)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync

      - name: Restore historical match data
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: football-data-${{ github.run_id }}
          restore-keys: football-data-

      - name: Download historical data (first run or cache miss)
        run: |
          uv run python - <<'EOF'
          import glob
          csvs = [f for f in glob.glob("data/raw/*.csv") if "fixtures" not in f]
          if len(csvs) < 50:
              from src.data.download import download_all
              download_all()
          EOF

      - name: Run backtest
        run: uv run python main.py --per-league --update

      - name: Stage HTML for Pages
        run: |
          mkdir -p docs
          cp reports/evaluation_report.html docs/eval.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # preserve index.html between evaluate runs
