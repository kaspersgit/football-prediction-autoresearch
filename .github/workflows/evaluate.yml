name: Evaluate

on:
  # See predict.yml for why each Amsterdam-local target needs two UTC cron
  # entries (CEST vs CET) — same DST caveat applies here.
  schedule:
    - cron: '0 2 * 4-10 1'        # Monday 04:00 Amsterdam (CEST, weekly backtest refresh)
    - cron: '0 3 * 11,12,1,2,3 1' # Monday 04:00 Amsterdam (CET,  weekly backtest refresh)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync

      - name: Restore historical match data
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: football-data-${{ github.run_id }}
          restore-keys: football-data-

      - name: Download historical data (first run or cache miss)
        run: |
          uv run python - <<'EOF'
          from pathlib import Path

          from src.data.download import LEAGUES, SEASONS, download_all

          raw_dir = Path("data/raw")
          expected = {
              raw_dir / f"{league}_{season}.csv"
              for league in LEAGUES.values()
              for season in SEASONS
          }
          if not expected.issubset(set(raw_dir.glob("*.csv"))):
              download_all()
          EOF

      - name: Run backtest
        run: uv run python main.py --per-league --threshold 0.0 --pinnacle-filter --update --all-leagues-production

      - name: Diagnose team-name aliases for non-production leagues
        env:
          THEODDS_API: ${{ secrets.THEODDS_API }}
        run: |
          uv run python - <<'EOF'
          import os

          import requests

          from src.config import PRODUCTION_LEAGUES, SUPPORTED_LEAGUES
          from src.data.loader import load_all_data
          from src.data.pinnacle_odds import _LEAGUE_TO_SPORT_KEY
          from src.data.team_aliases import ODDS_API_TEAM_ALIASES

          api_key = os.environ["THEODDS_API"]
          df = load_all_data()
          candidates = [lg for lg in SUPPORTED_LEAGUES if lg not in PRODUCTION_LEAGUES]

          print("\n=== TEAM-ALIAS DIAGNOSTIC (non-production leagues) ===")
          for league in candidates:
              sport_key = _LEAGUE_TO_SPORT_KEY.get(league)
              if sport_key is None:
                  print(f"{league}: no Odds API sport key, skipped")
                  continue
              historical_teams = set(df.loc[df["league"] == league, "HomeTeam"]) | set(
                  df.loc[df["league"] == league, "AwayTeam"]
              )
              alias_map = ODDS_API_TEAM_ALIASES.get(league, {})
              try:
                  resp = requests.get(
                      f"https://api.the-odds-api.com/v4/sports/{sport_key}/odds/",
                      params={
                          "apiKey": api_key,
                          "regions": "eu",
                          "markets": "h2h",
                          "bookmakers": "pinnacle",
                          "oddsFormat": "decimal",
                      },
                      timeout=30,
                  )
                  resp.raise_for_status()
                  events = resp.json()
              except (requests.RequestException, ValueError) as e:
                  print(f"{league}: fetch failed ({e})")
                  continue

              unmatched = set()
              for ev in events:
                  for name in (ev.get("home_team"), ev.get("away_team")):
                      if name is None:
                          continue
                      resolved = alias_map.get(name, name)
                      if resolved not in historical_teams:
                          unmatched.add(name)

              status = "OK, all matched" if not unmatched else f"NEEDS ALIASES: {sorted(unmatched)}"
              print(f"{league}: {len(events)} live events — {status}")
          EOF

      - name: Commit updated evaluation artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/evaluation_bets.csv reports/backtest_bets.csv models/league_thresholds.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update evaluation artifacts"
            git push
          fi
